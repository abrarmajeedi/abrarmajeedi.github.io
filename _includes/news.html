<section id="news" class="section reveal">
  <h2 class="section-title">News and Updates</h2>
  <div class="news-list">
    {% for item in site.data.news %}
    <div class="news-item">
      <div class="news-date">{{ item.date }}</div>
      {%- comment -%}
        Links inside news text are authored as raw HTML in _data/news.yml, so the
        new-tab attributes are injected here. New entries pick this up for free.
      {%- endcomment -%}
      <div class="news-text">{{ item.text | replace: '<a href=', '<a target="_blank" rel="noopener" href=' }}</div>
    </div>
    {% endfor %}
  </div>
</section>
