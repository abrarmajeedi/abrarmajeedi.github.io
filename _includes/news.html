<section id="news" class="section reveal">
  <h2 class="section-title">News and Updates</h2>
  <div class="news-list">
    {% for item in site.data.news %}
    <div class="news-item">
      <div class="news-date">{{ item.date }}</div>
      <div class="news-text">{{ item.text }}</div>
    </div>
    {% endfor %}
  </div>
</section>
